practice:
  label: 2 / 3
  title: Practice
  lead: Development projects and joint studies carried out with companies, schools and local communities.
  items:
    - kind: Joint research with HEROIC Inc.
      title: Research on Engagement Evaluation Using Multimodal Sensing Information for Visualizing Human Capital
      href: https://heroic.co.jp/pdf/tamagawa_press.pdf
      href_label: Press release (PDF, Japanese)
      body: Developing methods to quantitatively evaluate the engagement of human capital, the source of corporate competitiveness and sustainable growth, from biometric, behavioral and environmental data. The goal is a new framework that feeds the results into HR strategy and investment decisions.
      tags: [Multimodal, Engagement, Human capital]
      feature: true
    - kind: Tokyo University of the Arts × Hagi × Tsukuba University of Technology × Tamagawa University (2026)
      title: “Forms to Touch, Forms to See” exhibition
      href: https://www.geidai.ac.jp/news/20260326156923.html
      href_label: Announcement (Japanese)
      body: As part of the J-PEAKS regional core project “Visual and Hearing Impairment × AI × Art,” I took part as a collaborator in an exhibition at Hagi Meirin Gakusha, Yamaguchi. Tactile sculpting experiences using 3D printing and sensing explored new possibilities for Hagi ware and connections among diverse people. Co-organized with Tokyo University of the Arts, CASA Inc., Makino Kiln, EYES Inc. and Tsukuba University of Technology (March 29 to April 29, 2026).
      tags: [3D printing, Sensing, Accessibility]
      feature: true
    - kind: With the Tamagawa Academy Coral Research Club
      title: Development of a Coral Aquaculture Support App
      body: Educational support that helps new members and students understand coral breeding and aquaculture. It combines animation generation AI for the breeding process, audio podcasts generated from long texts, and conversational AI for Q&A.
      tags: [Generative AI, Podcast, Education]
    - kind: App development (iOS, Android, macOS)
      title: Personalized Support Service Based on Distributed Personal Data Management
      body: An app that securely records and manages personal information, built with Flutter/Dart for iOS, Android and macOS. It includes consent-based data governance (access control and a visible usage history) and is designed with future use as a Personal AI (PAI) in mind.
      tags: [Flutter, PDS, Consent management]
    - kind: Domestic joint research
      title: Building a Case Database of Musculoskeletal Pain Patients in Acupuncture Clinics Using Electronic Systems
      body: Designed and implemented a foundation that systematically collects case information from acupuncture clinics for clinical research and education. The structure anticipates analysis with natural language processing and symptom classification AI, while keeping data entry quick and standardized in the clinic.
      tags: [Case database, NLP, Clinical]
      anchor: crowdfunding
      anchor_label: Funded through crowdfunding
    - kind: Company partnership
      title: Game Center Company Partnership App
      body: Patrons scan a QR code posted in the store, reach an AI through LINE, and solve problems in a ChatGPT dialogue. It reduces the load on staff while improving customer satisfaction.
      tags: [LINE, ChatGPT, QR code]
    - kind: Dialogue system
      title: Dialogue System Supporting Optimal Matching Between Companies and Users
      body: A LINE front end combined with ChatGPT / Claude and RAG on Azure AI Search. It searches company information and user preferences in context and generates well-matched recommendations.
      tags: [RAG, Azure AI Search, LINE]
    - kind: LINE official account
      title: “Mono-wakari no Yoi Joushi” (The Understanding Boss)
      body: An AI chatbot where students and other users can talk about their worries. Its ChatGPT dialogue takes in what people write and answers with empathy. Distributed as a public LINE account.
      tags: [LINE, ChatGPT, Counseling]

music:
  label: 3 / 3
  title: Music
  lead: Active since 2010 as a pianist and composer under the name <strong>brightwaltz</strong>, writing and performing across jazz, pop and classical, grounded in piano improvisation.
  stats:
    - value: "2010"
      label: Year started
    - value: "65"
      label: Tracks published on <a href="https://dova-s.jp/creator/detail/81" target="_blank" rel="noopener">DOVA-SYNDROME</a>
  areas:
    - title: XR and contemporary art
      body: Composed the music for Rio Nakada’s immersive work <a href="https://www.tactus.jp/nox" target="_blank" rel="noopener">“Nox”</a>, an official selection of the Venice Immersive Competition at the 83rd Venice International Film Festival (2026). Also scored the short film SIGNS OF LIFE™ (2024).
    - title: Media art projects
      body: Provided music for video works by Yoichi Ochiai (University of Tsukuba Digital Nature Lab; solo exhibition “<a href="https://www.youtube.com/watch?v=98VGJzv7xlc" target="_blank" rel="noopener">Memories of the Unknown</a>”; <a href="https://www.youtube.com/watch?v=hE2CStcAO8o" target="_blank" rel="noopener">Kenpoku Art Festival</a>, track <a href="https://dova-s.jp/bgm/play2115.html" target="_blank" rel="noopener">Forest of Conifer Trees</a>) and for the <a href="https://www.youtube.com/watch?v=slKkMmgJ1HY" target="_blank" rel="noopener">Osaka-Kansai Expo theme project “Brilliance of Life”</a> produced by Yoichi Ochiai.
    - title: Public institutions and local governments
      body: Used in official content such as the <a href="https://www.youtube.com/watch?v=XeKHCGbArYI" target="_blank" rel="noopener">Ministry of the Environment, Sado Nature Conservation Office</a> films on the reintroduction of the crested ibis (Japanese and English), the Niigata Prefecture channel’s “<a href="https://www.youtube.com/watch?v=h37s0PBu4AE" target="_blank" rel="noopener">Sado Terraced Rice Field Journey</a>,” and <a href="https://www.youtube.com/watch?v=mprRYj43jGg" target="_blank" rel="noopener">exhibition films for the Oita Prefectural Art Museum</a>.
    - title: Games and film
      body: "BGM for the game “<a href=\"https://dic.pixiv.net/a/%E6%AE%BA%E6%88%AE%E3%81%AE%E5%A4%A9%E4%BD%BF#h2_3\" target=\"_blank\" rel=\"noopener\">Angels of Death</a>” and the indie game “<a href=\"https://life0.info/dreaminher/index\" target=\"_blank\" rel=\"noopener\">Dreamin’ Her</a>,” the ending theme of the film “Akai Akai Aoringo,” music for the short film “Re: Poem,” and many other commercial credits."
    - title: Live performance and streaming
      body: Performed at the Ginza music hall <a href="https://ginzatact.com/detail.php?id=202505_022" target="_blank" rel="noopener">GINZA TACT</a> (2025), the Tachikawa Sansan Illumination commemorative concert (2021) and more. “<a href="https://www.youtube.com/watch?v=d8Z2rtXotro" target="_blank" rel="noopener">Stories Will One Day Help Someone</a>” by Senkohanami (composer) is on major streaming services.
  links:
    - label: Music portfolio on my personal site
      href: https://brightwaltz.mystrikingly.com/#portfolio
    - label: SoundCloud
      href: https://soundcloud.com/brightwaltz

crowdfunding:
  label: Coda
  title: Crowdfunding
  lead: Two projects, one in research and one in music, made possible by supporters.
  items:
    - kind: Domestic joint research
      title: Building a case database of musculoskeletal pain patients in acupuncture clinics using electronic medical records
      href: https://camp-fire.jp/projects/703754/view
      purpose: Collect cases of musculoskeletal pain patients across multiple acupuncture clinics through electronic medical records, and build a research foundation that accumulates and shares clinical evidence.
      stats:
        - value: ¥1,395,289
          label: Raised
        - value: 465%
          label: Of the ¥300,000 goal
        - value: "240"
          label: Supporters
      outcomes:
        - Set up a system for pilot case collection at about 10 clinics, with the electronic medical records ready for operation.
        - Gave interim reports and academic presentations, including at the Japan Society of Acupuncture and Moxibustion, and continue with feedback from the field.
        - Designed the case data to be usable for natural language processing, symptom classification and outcome prediction models.
    - kind: Personal art project
      title: “I want to turn my experiences with depression, panic disorder and bipolar disorder into songs”
      href: https://camp-fire.jp/projects/610230/view
      purpose: Write and share songs based on my own recovery story as someone living with mental illness, to build understanding and empathy around mental health.
      stats:
        - value: ¥421,780
          label: Raised
        - value: 140%
          label: Of the ¥300,000 goal
        - value: "79"
          label: Supporters
      outcomes:
        - Produced the songs from lyrics and composition through recording and mixing, and delivered early releases and rewards (track data, event invitations, cassette tapes and more).
        - An art and social expression project so that first-person experiences can reach others as stories that may one day help someone.
  site_label: Project page on CAMPFIRE (Japanese)

