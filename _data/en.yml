research:
  label: 1 / 3
  title: Research
  approach:
    - Centered on data sovereignty for individuals and explainability, with the full path from design to prototype to evaluation in the field.
    - Treating documents and knowledge as graphs, so they are easier to understand and easier to reuse.
    - Working on the challenges of an aging society through data and UX, one small field study at a time.
  interests_title: Research interests
  interests:
    - name: Personal Data & Personal AI
      detail: Distributed PDS, consent and governance, personal optimization
    - name: Graph-Document
      detail: Knowledge structuring, collaborative authoring, RAG input and output design
    - name: Learning Support
      detail: University education, adult re-learning, assessment design
    - name: Multimodal / Observational Sensing
      detail: Aging society, healthcare, daily-life context measurement
    - name: Human-Computer Interaction / Web & Service Informatics
      detail: ""
  themes_title: Research themes
  themes:
    - title: Personal Data & Personal AI
      body: Personal data management based on distributed PDS, and Personal AI (PAI) dedicated to each individual. Includes operational design, consent management and evaluation methods in educational and regional contexts.
      keywords: [PDS / PAI, Data Governance, Consent, Privacy-by-Design]
    - title: Graph-Document for Learning & Work
      body: Making thinking visible and reusable through collaborative graph-document authoring. Structuring for learning, training and internal knowledge, along with quality design for RAG input and output.
      keywords: [Graph-Document, Collaborative Authoring, Critical Thinking, RAG]
    - title: Multimodal / Observational Sensing
      body: Understanding and evaluating states through multi-perspective observation of audio, video and behavior. Aiming for lightweight measurement that fits naturally into on-site operations.
      keywords: [Multimodal, Engagement, Aging Society, Human Factors]
  outputs_title: Selected outputs
  outputs:
    - year: "2025"
      venue: Journal of the Japanese Society for Artificial Intelligence
      title: Prospects for Personal AI using small language models
    - year: "2024"
      venue: Bulletin of the College of Engineering, Tamagawa University (peer reviewed)
      title: Proposal and practice of course design using text generation AI
    - year: "2023"
      venue: NCSP 2023 (oral presentation, session chair at the same conference)
      title: Collaborative Learning Support Environment Utilizing Graph Documents
  outputs_note: The complete list of papers, talks and awards is on researchmap.
  outputs_link: See publications on researchmap
  teaching_title: Teaching and service (selected)
  teaching:
    - "Tamagawa University: graduation research, laboratory and seminar courses, and more"
    - "Academic societies: Information Processing Society of Japan, Japanese Society for Artificial Intelligence, Human Interface Society, and others"
  lab_note: These themes are carried out with students in my lab. The lab website has the details of each study and the students' graduation research.
  lab_link: Visit the lab website

