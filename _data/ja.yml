practice:
  label: 2 / 3
  title: 社会実装
  lead: 企業・学校・地域と組んで進めた開発と共同研究です。
  items:
    - kind: 株式会社HEROIC との共同研究
      title: 人的資本可視化のためのマルチモーダルセンシング情報を用いたエンゲージメント評価に関する研究
      href: https://heroic.co.jp/pdf/tamagawa_press.pdf
      href_label: プレスリリース（PDF）
      body: 企業の競争力と持続的な成長の源である「人的資本」のエンゲージメントを、生体情報・行動データ・環境データなどから定量的に評価する手法を開発しています。評価結果を人材戦略や投資判断に生かす、新しい枠組みの構築を目指します。
      tags: [マルチモーダル, エンゲージメント, 人的資本]
      feature: true
    - kind: 東京藝術大学 × 萩 × 筑波技術大学 × 玉川大学（2026）
      title: 「さわるかたち みるかたち」展
      href: https://www.geidai.ac.jp/news/20260326156923.html
      href_label: 東京藝術大学のお知らせ
      body: 地域中核事業 J-PEAKS「視覚・聴覚障がい × AI × アート」の一環として、萩・明倫学舎（山口県）で開かれた展覧会に協力者として参画しました。3D プリントとセンシング技術を使った触れる造形体験で、萩焼の新しい可能性と、多様な人どうしのつながりを探りました。東京藝術大学・株式会社CASA・牧野窯・株式会社アイズ・筑波技術大学との共同実施（2026.3.29〜4.29）。
      tags: [3D プリント, センシング, アクセシビリティ]
      feature: true
    - kind: 玉川学園サンゴ研究部との連携
      title: サンゴ養殖支援サービスアプリの開発
      body: 新入部員や学生がサンゴの飼育・養殖を理解しやすくするための教育支援です。飼育の過程を学べるアニメーション生成 AI、長い文章から作る音声ポッドキャスト、質疑応答を支える対話型 AI を組み合わせました。
      tags: [生成 AI, ポッドキャスト, 教育支援]
    - kind: アプリ開発（iOS・Android・macOS）
      title: パーソナルデータの分散管理技術に基づく個人最適化型支援サービス
      body: 個人の情報を安全に記録・管理するアプリを、Flutter/Dart で iOS・Android・macOS に展開しました。同意に基づくデータ活用のガバナンス（アクセス制御、利用履歴の可視化）を備え、パーソナル AI（PAI）への応用を見据えて設計しています。
      tags: [Flutter, PDS, 同意管理]
    - kind: 国内共同研究
      title: 電子システムを活用した鍼灸院における筋骨格痛患者の症例データベース構築
      body: 鍼灸院の症例情報を体系的に集め、臨床研究や教育に使える基盤を設計・実装しました。自然言語処理や症状分類 AI による解析を見据えた構造と、現場での入力のしやすさ・データの標準化を両立させています。
      tags: [症例データベース, 自然言語処理, 臨床]
      anchor: crowdfunding
      anchor_label: クラウドファンディングで実施
    - kind: 企業との連携
      title: ゲームセンター企業との連携アプリ
      body: 店舗に掲示した QR コードから LINE で AI にアクセスし、ChatGPT との対話でトラブルを解決します。現場スタッフの負担を減らしながら、利用者の満足度を高める仕組みです。
      tags: [LINE, ChatGPT, QR コード]
    - kind: 対話システム
      title: 企業とユーザの最適マッチングを支援する対話システム
      body: LINE を窓口に、ChatGPT / Claude と Azure AI Search による RAG を組み合わせました。企業情報とユーザの希望を文脈で検索し、適合度の高い提案を生成します。
      tags: [RAG, Azure AI Search, LINE]
    - kind: LINE 公式アカウント
      title: 「ものわかりの良い上司」
      body: 学生や利用者が悩みを気軽に相談できる AI ボットです。ChatGPT による対話で、入力された悩みを柔軟に受け止め、共感的に返答します。公開の LINE アカウントとして配信しています。
      tags: [LINE, ChatGPT, 相談]

music:
  label: 3 / 3
  title: 音楽
  lead: <strong>brightwaltz</strong>（ブライトワルツ）名義で 2010 年から活動するピアニスト・作曲家です。ピアノの即興をもとに、ジャズ・ポップス・クラシックを横断して作曲・演奏しています。
  stats:
    - value: "2010"
      label: 活動を始めた年
    - value: "65"
      label: <a href="https://dova-s.jp/creator/detail/81" target="_blank" rel="noopener">DOVA-SYNDROME</a> で公開している曲（累計）
  areas:
    - title: XR・現代アート作品との協働
      body: ナカダリオ監督のイマーシブ作品 <a href="https://www.tactus.jp/nox" target="_blank" rel="noopener">『Nox』</a>（第 83 回ヴェネチア国際映画祭 Venice Immersive Competition 正式選出、2026）で音楽を担当。短編映画 SIGNS OF LIFE™（2024）の音楽も担当しました。
    - title: メディアアート・プロジェクトへの楽曲提供
      body: 落合陽一氏の映像作品（筑波大学デジタルネイチャー研究室、個展「<a href="https://www.youtube.com/watch?v=98VGJzv7xlc" target="_blank" rel="noopener">未知への追憶</a>」、<a href="https://www.youtube.com/watch?v=hE2CStcAO8o" target="_blank" rel="noopener">県北芸術祭</a>（楽曲：<a href="https://dova-s.jp/bgm/play2115.html" target="_blank" rel="noopener">Forest of Conifer Trees</a>）など）や、<a href="https://www.youtube.com/watch?v=slKkMmgJ1HY" target="_blank" rel="noopener">大阪・関西万博テーマ事業「いのちの輝きプロジェクト」</a>（落合陽一プロデュース）に楽曲を提供しました。
    - title: 公共機関・自治体の映像への楽曲提供
      body: <a href="https://www.youtube.com/watch?v=XeKHCGbArYI" target="_blank" rel="noopener">環境省 佐渡自然保護官事務所</a>のトキ野生復帰の映像（日本語版・英語版）、新潟県公式チャンネル「<a href="https://www.youtube.com/watch?v=h37s0PBu4AE" target="_blank" rel="noopener">佐渡棚田紀行</a>」、<a href="https://www.youtube.com/watch?v=mprRYj43jGg" target="_blank" rel="noopener">大分県立美術館の展覧会映像</a>など、行政と公立文化施設の公式コンテンツで使われています。
    - title: ゲーム・映像作品への楽曲提供
      body: ゲーム「<a href="https://dic.pixiv.net/a/%E6%AE%BA%E6%88%AE%E3%81%AE%E5%A4%A9%E4%BD%BF#h2_3" target="_blank" rel="noopener">殺戮の天使</a>」、インディーゲーム「<a href="https://life0.info/dreaminher/index" target="_blank" rel="noopener">Dreamin' Her</a>」に BGM を提供。映画「あかいあかい青りんご」のエンディングテーマ、短編映画「Reポエム」の音楽など、映像とゲームでの商業作品が多数あります。
    - title: ライブ演奏とサブスク配信
      body: 銀座の音楽ホール <a href="https://ginzatact.com/detail.php?id=202505_022" target="_blank" rel="noopener">GINZA TACT</a> でのライブ（2025）、立川 燦燦 Illumination 記念コンサート（2021）などに出演。線香花美「<a href="https://www.youtube.com/watch?v=d8Z2rtXotro" target="_blank" rel="noopener">物語はいつか誰かの役に立つ</a>」（作曲）を各種サブスクで配信しています。
  links:
