research:
  label: 1 / 3
  title: 研究
  approach:
    - データの本人主権と説明可能性を軸に、設計・試作・評価という現場実装までの一連の流れを意識しています。
    - 文書や知識をグラフとして扱い、理解のしやすさと再利用のしやすさを両立させます。
    - 高齢社会の課題にデータと UX で取り組み、小さな実証を積み上げることを重視しています。
  interests_title: 研究の関心
  interests:
    - name: Personal Data & Personal AI
      detail: 分散 PDS、同意とガバナンス、個人最適化
    - name: Graph-Document
      detail: 知識の構造化、協働編集、RAG の入出力設計
    - name: Learning Support
      detail: 大学教育・社会人の学び直し、評価設計
    - name: Multimodal / Observational Sensing
      detail: 高齢社会・医療・生活文脈の計測
    - name: Human-Computer Interaction / Web & Service Informatics
      detail: ""
  themes_title: 研究テーマ
  themes:
    - title: Personal Data & Personal AI
      body: 分散 PDS に基づく個人データの管理と、個人に専属するパーソナル AI（PAI）の検討。教育・地域での運用設計、同意の管理、評価の方法を含みます。
      keywords: [PDS / PAI, Data Governance, Consent, Privacy-by-Design]
    - title: Graph-Document for Learning & Work
      body: グラフ文書の協働作成による、思考の可視化と再利用。学習・研修・社内ナレッジでの構造化と、RAG の入出力の品質設計。
      keywords: [Graph-Document, Collaborative Authoring, Critical Thinking, RAG]
    - title: Multimodal / Observational Sensing
      body: 音・映像・行動などの多視点の観察から、状態の理解と評価を行います。現場の運用になじむ軽量な計測を目指しています。
      keywords: [Multimodal, Engagement, Aging Society, Human Factors]
  outputs_title: 主な業績
  outputs:
    - year: "2025"
      venue: 人工知能（人工知能学会誌）
      title: 小規模言語モデルによるパーソナル AI の展望
    - year: "2024"
      venue: 玉川大学工学部紀要（査読あり）
      title: 文章生成 AI を用いた授業デザインの提案・実践
    - year: "2023"
      venue: NCSP 2023（口頭発表・同会期セッション座長）
      title: Collaborative Learning Support Environment Utilizing Graph Documents
  outputs_note: 論文・発表・受賞などの全件は researchmap にまとめています。
  outputs_link: researchmap で業績を見る
  teaching_title: 教育と学会活動（抜粋）
  teaching:
    - 玉川大学：卒業研究、実験・演習系の科目ほか
    - 学会活動：情報処理学会・人工知能学会・ヒューマンインタフェース学会 など
  lab_note: これらのテーマは、研究室で学生と一緒に進めています。研究の詳しい内容と卒業研究の成果は、研究室のサイトにあります。
  lab_link: 研究室のサイトを見る

