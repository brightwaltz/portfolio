      href: https://brightwaltz.mystrikingly.com/#portfolio
    - label: SoundCloud
      href: https://soundcloud.com/brightwaltz

crowdfunding:
  label: Coda
  title: クラウドファンディング
  lead: 研究と音楽のそれぞれで、支援を集めて実現したプロジェクトです。
  items:
    - kind: 国内共同研究
      title: 電子カルテシステムを活用した鍼灸院における筋骨格痛患者の症例データベース構築
      href: https://camp-fire.jp/projects/703754/view
      purpose: 鍼灸院の筋骨格痛患者の症例を電子カルテで多施設から集め、臨床のエビデンスを蓄積・発信できる研究基盤をつくる。
      stats:
        - value: ¥1,395,289
          label: 支援総額
        - value: 465%
          label: 達成率（目標 ¥300,000）
        - value: "240"
          label: 支援者（名）
      outcomes:
        - 約 10 施設で試験的に症例を集められるシステムを整え、電子カルテの運用準備を終えました。
        - 全日本鍼灸学会などで中間報告・学術発表を行い、現場のフィードバックを受けながら進めています。
        - 自然言語処理・症状分類 AI・効果予測モデルに使えるよう、症例データを設計しています。
    - kind: 個人・アート
      title: 「うつ病、パニック障害、双極性障害の体験を歌にして届けたい！」
      href: https://camp-fire.jp/projects/610230/view
      purpose: 精神疾患の当事者としてのリカバリーストーリーを歌にして制作・発信し、メンタルヘルスへの理解と共感を広げる。
      stats:
        - value: ¥421,780
          label: 支援総額
        - value: 140%
          label: 達成率（目標 ¥300,000）
        - value: "79"
          label: 支援者（名）
      outcomes:
        - 作詞・作曲・レコーディング・ミキシングまで楽曲を制作し、先行配信とリターン（楽曲データ、イベント招待、カセットテープなど）を実施しました。
        - 当事者の体験が「誰かの役に立つ物語」として届くことを目指した、アートと社会表現の取り組みです。
  site_label: CAMPFIRE のページ

