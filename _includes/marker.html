{%- comment -%} 節の目印。include.beat が 1〜3 なら三つの点のうち該当を塗る。coda なら複縦線。 {%- endcomment -%}
<p class="marker">
  {%- if include.beat == 'coda' %}
  <span class="marker__coda" aria-hidden="true"></span>
  {%- else %}
  <span class="marker__dots" aria-hidden="true">{% for i in (1..3) %}<i{% if forloop.index == include.beat %} class="is-on"{% endif %}></i>{% endfor %}</span>
  {%- endif %}
  <span class="marker__label"{% if include.lang %} lang="{{ include.lang }}"{% endif %}>{{ include.label }}</span>
</p>
